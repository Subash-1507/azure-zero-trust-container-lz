# Trivy secret-scanning config (picked up automatically from the repo root, locally and in CI).
# The Azure Tables SDK ships the public Azurite emulator key (devstoreaccount1), documented by Microsoft.
# The allowance is limited to that SDK file; a real key anywhere else still fails the build.
allow-rules:
  - id: azurite-emulator-key-in-azure-tables-sdk
    description: Public Azurite development key bundled inside the azure-data-tables package
    path: /app/deps/azure/data/tables/(__pycache__/)?_base_client(\.cpython-\d+)?\.pyc?$
