# Checkov runs against the whole repo in CI. Frameworks are added as the project grows
# (terraform and kubernetes come with chapters 3-5).
# Every suppression must be inline, next to the code, with a reason.
framework:
  - dockerfile
  - terraform
  - github_actions
  - secrets
skip-path:
  - .terraform
compact: true
quiet: true
download-external-modules: false
