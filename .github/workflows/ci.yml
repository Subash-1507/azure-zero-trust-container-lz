name: ci

# Every pull request and push to main: lint and build both images, scan them, produce an SBOM,
# and check the repo for misconfigurations and secrets. Any HIGH/CRITICAL finding fails the run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default; jobs ask for more only where they upload results.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment); Dependabot proposes updates.
jobs:
  hadolint:
    name: Hadolint (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/${{ matrix.image }}/Dockerfile
          failure-threshold: warning

  image:
    name: Build, scan and SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      IMAGE: ${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag "$IMAGE" "app/${{ matrix.image }}"

      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: "1"

      - name: Trivy full report (all severities, to the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          hide-progress: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif

      - name: Upload Trivy results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false

  checkov:
    # Name kept as is: branch protection requires this exact check name. It also scans Terraform and Kubernetes.
    name: Checkov (Dockerfiles, Actions, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # k8s/ holds kustomize templates. Render them the way `kubectl apply -k` would, with placeholder
      # identifiers, so Checkov scans what actually gets deployed (namespace and image digests included).
      - name: Render Kubernetes manifests
        run: |
          cp k8s/azure.env.example k8s/azure.env
          kubectl kustomize k8s > k8s-rendered.yaml

      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov results
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov.sarif
          category: checkov

  gitleaks:
    name: Gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false # keeps this job read-only
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      # -backend=false: validation needs no cloud credentials or state access
      - name: terraform validate
        working-directory: infra/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
