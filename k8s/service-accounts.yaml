# The api service account is the only subject the Entra ID federated credential trusts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    azure.workload.identity/client-id: set-by-kustomize-from-azure-env
automountServiceAccountToken: false  # no Kubernetes API token; workload identity mounts its own short-lived token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
