# Mounts the Key Vault secret as a read-only file through the CSI driver, using the api's workload identity.
# There is no secretObjects block, so the value is never copied into a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notes-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: set-by-kustomize-from-azure-env
    keyvaultName: set-by-kustomize-from-azure-env
    tenantId: set-by-kustomize-from-azure-env
    objects: |
      array:
        - |
          objectName: app-greeting
          objectType: secret
