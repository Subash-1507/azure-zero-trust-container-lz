# Pod Security Admission "restricted": Kubernetes itself rejects pods that are not hardened,
# a second layer underneath the Azure Policy (Gatekeeper) constraints.
apiVersion: v1
kind: Namespace
metadata:
  name: notes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
