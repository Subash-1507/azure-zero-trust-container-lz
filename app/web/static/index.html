<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-Trust Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Zero-Trust Notes</h1>
    <p id="greeting">Loading…</p>
    <form id="note-form">
      <input id="note-text" maxlength="280" placeholder="Write a note" required>
      <button type="submit">Add</button>
    </form>
    <ul id="notes"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
