# Hardened nginx for the web tier: non-root, read-only root filesystem (only /tmp is writable).
worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  server_tokens off;                      # do not reveal the nginx version

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # The browser only ever talks to this tier; the API is reachable only through here
    location /api/ {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      client_max_body_size 4k;
    }

    location / { try_files $uri /index.html; }
  }
}